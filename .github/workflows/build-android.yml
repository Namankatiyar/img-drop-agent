name: Build Android APK (arm64)

on:
  push:
    branches:
      - master
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type: both, release (standalone, no Metro), debug (Dev Client with Metro)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - release
          - debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Tests & Types
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install

      - name: 🧪 Run Unit Tests
        run: bun test

      - name: 🔍 Type-check
        run: bun run typecheck

  build-android:
    name: Build Android APK (arm64-v8a)
    needs: [verify]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install root dependencies
        run: bun install

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: ⚙️ Expo Prebuild (Generate Android Native Project)
        run: |
          cd apps/mobile
          npx expo prebuild --platform android --no-install

      - name: 🔨 Configure Gradle Performance & Release Signing
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties
          echo "reactNativeArchitectures=arm64-v8a" >> ~/.gradle/gradle.properties

          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin("com.android.application")) {
                      project.android.buildTypes.release.signingConfig = project.android.signingConfigs.debug
                  }
              }
          }
          EOF

      - name: 🚀 Build Android APK (arm64-v8a)
        run: |
          cd apps/mobile/android
          BUILD_TYPE="${{ github.event.inputs.build_type || 'both' }}"
          echo "Building for target: $BUILD_TYPE..."
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          elif [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
          else
            ./gradlew assembleDebug assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          fi

      - name: 📤 Upload Standalone Release APK (No Metro Needed)
        if: ${{ github.event.inputs.build_type != 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: imgdrop-release-standalone-arm64-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: 📤 Upload Dev Client Debug APK (For Live Hot Reload)
        if: ${{ github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: imgdrop-debug-devclient-arm64-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
